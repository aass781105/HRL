# OR-Tools dynamic baseline matching the PPO cadence semantics.
# Replans: INIT, then every 10 decision steps; one decision step = 2 arrivals.

# --- Scheduler ---
scheduler_type: OR-Tools
hl_gate_cadence: 5
hl_gate_decision_interval: 2
ortools_subproblem_time_limit: 1800.0
ortools_total_solve_time_budget: 0.0

# --- Dynamic Environment ---
n_m: 5
low: 1
high: 99
event_horizon: 160
interarrival_mean: 25
arrival_mode: uniform
interarrival_uniform_low: 20
interarrival_uniform_high: 45
init_jobs: 50
burst_size: 1
event_seed: 8
fast_mode: false

# --- Due Date ---
# Both initial and arriving jobs use mix_urgent_normal.
hl_due_date_urgent_prob: 0.3
hl_due_date_k_urgent_low: 1.5
hl_due_date_k_urgent_high: 3.0
hl_due_date_k_normal_low: 6.0
hl_due_date_k_normal_high: 12.0

# --- Output ---
plot_run_name: ortools_seed8_c5_k2_30min
