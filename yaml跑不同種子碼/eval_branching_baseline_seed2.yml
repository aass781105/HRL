# Evaluation config for Branching Simulation under BASELINE scenario
# Seed: 2

# --- Scheduler ---
hl_gate_policy: ppo
hl_buffer_slack_release_threshold: 0
scheduler_type: PPO
ll_ppo_model_path: trained_network\SD2\ll_u1030_esttd_odprog.pth
hl_ppo_model_path: trained_weights\high_level\hlgate_scn_base_newstate_s07_p15_e8.pth
hl_ppo_name: hlgate_scn_base_newstate_s07_p15_e8
hl_ppo_separate_trunks: true
hl_ppo_value_num_layers: 1
hl_ppo_use_residual: true
hl_use_ll_buffer_embedding: false
hl_ll_buffer_embedding_dim: 128
hl_ll_buffer_projection_dim: 16
hl_initial_release_prob: 0.25
hl_eval_action_selection: greedy

# --- Dynamic Environment ---
n_m: 5
low: 1
high: 99
event_horizon: 300
interarrival_mean: 25
arrival_mode: uniform
interarrival_uniform_low: 20
interarrival_uniform_high: 45
init_jobs: 30
burst_size: 1
event_seed: 2
fast_mode: false
hl_env_scenario: baseline

# --- Due Date ---
hl_due_date_urgent_prob: 0.3
hl_due_date_k_urgent_low: 1.5
hl_due_date_k_urgent_high: 3
hl_due_date_k_normal_low: 7
hl_due_date_k_normal_high: 10

# --- Baseline Policy ---
hl_gate_decision_interval: 1
hl_gate_cadence: 5
baseline_cadence: 5

# --- Low-Level PPO Action Selection ---
ll_eval_action_selection: greedy
ll_rollout_k: 1

# --- Run Control ---
main_sample_runs: 1
eval_runs_per_instance: 1
disable_main_baseline: true
plot_run_name: odprog
