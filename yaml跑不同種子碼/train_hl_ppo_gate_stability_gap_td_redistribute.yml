# =====================================================================
# High-Level PPO Gate Training Config: Redistributed Step TD Gap + Stability
# =====================================================================

# --- Gate Policy & Unified Scheduler Configuration ---
hl_gate_policy: ppo
scheduler_type: PPO
ll_ppo_model_path: trained_network\SD2\llmk_range_u10_30_range3_env50_sizehold60_duehold20_short_mk10_esttd.pth

# --- Environment & Problem Scale Parameters ---
n_m: 5
low: 1
high: 99
event_horizon: 80
interarrival_mean: 25
arrival_mode: uniform
interarrival_uniform_low: 20
interarrival_uniform_high: 50
init_jobs: 50
burst_size: 1
due_date_k_low: 2.0
due_date_k_high: 9.0
event_seed: 1
fast_mode: true

# --- Reward & Credit Assignment Configuration (Redistributed TD Gap + Stability) ---
hl_td_credit_mode: redistribute          # Redistribute release reward backward over the preceding HOLD steps
hl_td_signal_source: baseline_gap_release_interval  # Compare interval TD increase with cadence baseline
hl_td_reward_coef: 0.0                   # Disable final terminal TD reward
hl_shaping_reward_coef: 1.0              # Enable interval TD gap reward coefficient
hl_release_reward_decay: 0.9             # Exponential decay rate (0.9) for backward redistribution
hl_mk_reward_coef: 0.0                   # Disable makespan rewards
hl_buffer_penalty_coef: 0.0              # Disable buffer occupancy/tardiness penalty

# --- Stability Penalty (free_threshold_terminal) ---
hl_stability_mode_v2: free_threshold_terminal  # Terminal squared escalation penalty for excess releases
hl_stability_scale: 0.01                 # Penalty scale per excess release
hl_stability_free_releases: 10           # Number of allowed "free" release events per episode

# --- High-Level PPO Training Hyperparameters (Aligned with params.py) ---
hl_ppo_name: hl_ppo_gate_stability_gap_td_redistribute
hl_ppo_updates: 200                      # Default in params.py
hl_ppo_num_envs: 4                       # Default in params.py
hl_ppo_use_async_envs: true
hl_ppo_train_seed: 142
hl_ppo_lr: 0.0001                        # 1e-4
hl_ppo_lr_decay: true
hl_ppo_lr_end: 0.00005                   # 5e-5
hl_ppo_gamma: 0.99
hl_ppo_gae_lambda: 0.95
hl_ppo_clip: 0.2
hl_ppo_entropy_coef: 0.01
hl_ppo_entropy_decay: false
hl_ppo_entropy_end: 0.005
hl_ppo_value_coef: 0.5
hl_ppo_update_epochs: 5
hl_ppo_minibatch_size: 64
hl_ppo_max_grad_norm: 1.0
hl_ppo_validate_every: 10
hl_ppo_instance_episodes: 10
hl_ppo_same_problem_eval_every: 0

hl_ppo_num_layers: 3
hl_ppo_hidden_dim: 512
hl_ppo_separate_trunks: false
hl_ppo_value_num_layers: 3
hl_ppo_value_hidden_dim: 512

