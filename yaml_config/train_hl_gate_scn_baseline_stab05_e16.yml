# High-level PPO training: baseline scenario, stability scale 0.5, 16 parallel environments.
# Hyperparameters follow train_hl_gate_seedenv_current_stab05_e16.yml.

# --- Scheduler ---
hl_gate_policy: ppo
scheduler_type: PPO
ll_ppo_model_path: trained_weights\lower_level\ll_u1030_esttd_odprog.pth
hl_ppo_model_path: trained_weights\high_level\hlgate_baseline_stab05_e16_newstate.pth

# --- Dynamic Environment ---
n_m: 5
low: 1
high: 99
event_horizon: 160
interarrival_mean: 25
arrival_mode: uniform
interarrival_uniform_low: 45
interarrival_uniform_high: 90
init_jobs: 50
burst_size: 1
hl_burst_size_mode: fixed
hl_burst_size_low: 1
hl_burst_size_high: 1
hl_same_batch_jobs: true
hl_burst_due_date_scale_alpha: 1.0
event_seed: 1
fast_mode: true
hl_env_scenario: baseline
hl_bottleneck_order_prob: 0.0
hl_bottleneck_order_machine_count: 1
hl_bottleneck_exclude_urgent: true
hl_bottleneck_group_sampling: rolling_freq

# --- Due Date ---
hl_due_date_urgent_prob: 0.3
hl_due_date_k_urgent_low: 1.5
hl_due_date_k_urgent_high: 3.0
hl_due_date_k_normal_low: 7.0
hl_due_date_k_normal_high: 10.0

# --- Decision and Reference Policy ---
hl_gate_decision_interval: 2
hl_gate_cadence: 5
baseline_cadence: 1
ll_eval_action_selection: greedy
ll_rollout_k: 1
hl_initial_release_prob: 0.25

# --- High-level Reward ---
hl_td_credit_mode: terminal_only
hl_release_reward_decay: 0.9
hl_td_signal_source: baseline_gap_final
hl_td_reward_coef: 0.1
hl_shaping_reward_coef: 0.0
hl_mk_reward_coef: 0.0
hl_buffer_penalty_coef: 0.01
hl_stability_mode_v2: immediate_all
hl_stability_scale: 0.5
hl_stability_power: 0.0
hl_stability_free_releases: 0

# --- High-level PPO ---
hl_ppo_name: hlgate_baseline_stab05_e16_newstate
hl_ppo_updates: 200
hl_ppo_num_envs: 16
hl_ppo_use_async_envs: true
hl_ppo_train_seed: 42
hl_ppo_lr: 0.0001
hl_ppo_lr_decay: true
hl_ppo_lr_end: 0.00005
hl_ppo_gamma: 0.995
hl_ppo_gae_lambda: 0.98
hl_ppo_clip: 0.2
hl_ppo_entropy_coef: 0.001
hl_ppo_entropy_decay: true
hl_ppo_entropy_end: 0.0001
hl_ppo_value_coef: 0.01
hl_ppo_update_epochs: 5
hl_ppo_minibatch_size: 160
hl_ppo_max_grad_norm: 1.0
hl_ppo_validate_every: 10
hl_ppo_instance_episodes: 20
hl_ppo_same_problem_eval_every: 0

# --- Network ---
hl_ppo_num_layers: 3
hl_ppo_hidden_dim: 512
hl_ppo_separate_trunks: true
hl_ppo_actor_hidden_dim: 512
hl_ppo_actor_num_layers: 3
hl_ppo_critic_hidden_dim: 512
hl_ppo_critic_num_layers: 3
hl_ppo_value_num_layers: 1
hl_ppo_use_residual: true
hl_ppo_use_glu: false
hl_ppo_pre_norm: false
