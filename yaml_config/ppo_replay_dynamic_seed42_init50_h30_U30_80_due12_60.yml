eval_model_name: llmk_range_u10_30_looseonly_hold30_short
ppo_model_path: trained_network\SD2\llmk_range_u10_30_looseonly_hold30_short.pth

# Dynamic replay instance
instance_json: dynamic_instances\dynamic_seed42_init50_h30_U30_80_due12_60.json
gate_cadence: 10
event_seed: 42
main_sample_runs: 10
plot_global_dir: plots\global

# Scheduler used by GlobalTimelineOrchestrator. The replay script also forces PPO.
scheduler_type: PPO
eval_action_selection: sample
ppo_sample: true

# Dynamic metadata kept consistent with the exported instance.
n_m: 5
low: 1
high: 99
event_horizon: 30
interarrival_mean: 25
arrival_mode: uniform
interarrival_uniform_low: 30
interarrival_uniform_high: 80
init_jobs: 50
burst_size: 1
due_date_k_low: 1.2
due_date_k_high: 6.0
fast_mode: false

# Low-level PPO architecture/training-compatible settings.
due_date_mode: range
val_due_date_mode: range
schedule_type: u10_30
mixed_size_hold_updates: 30
due_setting_hold_updates: 10
mixed_size_large_prob: 0.0
critic_size_context_max_n_j: 30.0
critic_due_context: false
layer_fea_output_dim: [64, 64, 64]
separate_actor_critic_encoder: false
ll_due_vloss_coef: false
ll_vtarget_norm: false
ll_critic_loss: huber
